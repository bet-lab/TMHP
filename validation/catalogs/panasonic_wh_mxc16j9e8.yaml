# WH-MXC16J9E8 -- Panasonic Aquarea, R32, 16 kW nominal heating.
#
# Published heating-performance grid: leaving water temperature x outdoor air
# temperature, with COP printed directly. Transcribed from the manufacturer
# documentation named under `source` below.
#
# The compressor displacement is a published specification of this machine:
# Panasonic's compressor division catalogues 9JD650XAA22 at 65.0 cm3/rev, and
# the outdoor unit's service-manual parts list names that compressor. Rated
# air flow is likewise read verbatim from the service manual. Both are inputs,
# not tuning -- every efficiency coefficient and conductance comes from the
# library defaults.
#
# Compressor kind and injection: this file's record (above, from the
# transcription of 2026-09) names 9JD650XAA22, a JD-series machine like the
# 9JD420XBA22 of the 9 and 12 kW units, which Panasonic's industrial
# compressor site lists as a "J2P" variable-speed R32 rotary. The 2026-11
# review of the validation machines' compressors read the parts lists of the
# 9 and 12 kW units directly but not this unit's again, so the model number
# stands on the earlier transcription alone (compressor_model: unconfirmed
# below). The kind is taken from the JD family designation and the circuit
# from the series: the same generation and refrigerant circuit as MXC09/12 --
# the bypass expansion valve outlet returns to the accumulator (suction), no
# injection port. Hence compressor_type: rotary, injection: none.
slug: panasonic_wh_mxc16j9e8
name: WH-MXC16J9E8
manufacturer: Panasonic
model_class: ASHPB
refrigerant: R32
nominal_capacity_kW: 16.0
