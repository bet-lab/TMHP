name: Deploy Sphinx Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - src/tmhp/**
      - scripts/data/**
      - scripts/validation/**
      - validation/parity/*.py
      - validation/catalogs/*.yaml
      - validation/results/*.csv
      - pyproject.toml
      - uv.lock
      - .github/workflows/docs.yml

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"

jobs:
  build-and-deploy:
    # TMHP is public: build and deploy on GitHub-hosted runners, never self-hosted.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Full history so sphinx-last-updated-by-git can compute the
          # per-page modification timestamps. The default shallow clone
          # (depth=1) trips the `git.too_shallow` warning for every page.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.UV_PYTHON }}

      - name: Cache cycle grid
        id: docs-data-cache
        uses: actions/cache@v4
        with:
          path: docs/source/_static/widgets/cycle_data.json
          key: >-
            cycle-grid-${{ runner.os }}-${{ env.UV_PYTHON }}-full-${{ hashFiles('uv.lock', 'pyproject.toml', 'docs/Makefile',
            'scripts/data/gen_refrigerant_data.py', 'src/tmhp/calc_util.py',
            'src/tmhp/mollier_diagram.py', 'src/tmhp/refrigerant.py') }}

      - name: Install dependencies
        run: uv sync --group docs --locked

      - name: Use restored cycle grid
        if: steps.docs-data-cache.outputs.cache-hit == 'true'
        run: |
          cd docs/source/_static/widgets
          test -s cycle_data.json
          touch cycle_data.full.stamp cycle_data.json

      - name: Build Sphinx Documentation
        run: make -C docs html DOCS_DATA_PROFILE=full DOCS_FRESH_DATA=1

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/build/html
