# Samsung EHS Mono HT Quiet R32 14 kW -- the unit the published validation
# paper uses, kept here so the documented parity numbers come from the same
# harness as every other unit.
#
# Two features of this machine matter when reading its errors. It is a
# high-temperature unit that reaches 65 degC leaving water at -10 degC outdoor
# air, which is a pressure ratio around 16 -- well past a single-stage
# envelope, reached by vapour injection, which TMHP does not model. And no
# compressor displacement is published for it, so this unit exercises the
# derived displacement rule rather than a specification input. Both are
# reasons to expect larger errors here than on the Panasonic units, and the
# results are reported without adjusting for either.
#
# Compressor kind and injection, as published: the service manual describes a
# scroll compressor with "Flash Injection" fed through an EVI expansion valve.
# Hence compressor_type: scroll, injection: flash. The single-stage model has
# no injection, so this unit is reported in the injection stratum of the
# headline and run with the scroll default.
slug: samsung_ehs_mono_ht_r32_14kw
name: Samsung EHS Mono HT Quiet R32 14 kW
manufacturer: Samsung
model_class: ASHPB
refrigerant: R32
nominal_capacity_kW: 14.0
cop_definition: "Q_cond / (E_cmp + E_fan), heating"
source:
  document: "Samsung EHS Mono HT Quiet R32 Technical Data Book (2024)"
  table: "Heating capacity and COP tables; reproduced as Table 1 of Jo & Choi, KJACR 2026"
  url: "https://www.theheatpumpwarehouse.co.uk/wp-content/uploads/2024/11/tdb-ehs-mono-ht-quiet-for-europe-r32-50hz-hp-ver.2.1-221005-compressed-compressed.pdf"
  compressor: "service manual: scroll, \"Flash Injection\", EVI expansion valve"
published_inputs:
  compressor_type: scroll
  injection: flash
notes: >-
  Sink convention. The harness evaluates every row through EN 14511 condenser
  water (tmhp.standard_conditions.en14511_condenser_water): entering water is
  the catalogue's leaving water minus the standard's rise, and the flow is the
  one that carries the published duty at that rise. The rise is 5 K at or below
  45 degC leaving, 8 K at 55 degC and 10 K at 65 degC, linear in between, so the
  40 / 50 / 65 degC columns enter at 35.0 / 43.5 / 55.0 degC.
  The paper this catalogue was first assembled for used a different convention,
  a 2.5 K leaving-water-to-tank offset below 60 degC and 5 K above it, and an
  intermediate revision of the harness carried a single 2.5 K offset. Neither is
  what runs now. Reproducing the paper's reported cycle state points therefore
  needs the paper's own offset: under EN 14511 water the same operating point
  lands up to about 2 K away, and the difference is the tank temperature rather
  than the cycle.
