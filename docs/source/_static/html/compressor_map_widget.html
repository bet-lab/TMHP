<style>
    .cmw-root {
        --cmw-bg: var(--sy-c-background, var(--sy-c-bg, #ffffff));
        --cmw-bg-soft: var(--sy-c-surface, var(--sy-c-bg-hover, #f6f8fa));
        --cmw-border: var(--sy-c-border, #e3e6ea);
        --cmw-fg: var(--sy-c-text, #1f2328);
        --cmw-muted: var(--sy-c-light, #57606a);
        --cmw-primary: var(--sy-c-link, var(--sy-c-primary, #3e63dd));
        --cmw-grid: color-mix(in srgb, var(--cmw-fg) 12%, transparent);
        --cmw-axis: color-mix(in srgb, var(--cmw-fg) 40%, transparent);
        --cmw-orange: #e8590c;
        --cmw-veil: var(--cmw-bg);

        position: relative;
        font-family: var(--rx-font-sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif);
        font-size: 14px;
        line-height: 1.45;
        color: var(--cmw-fg);
        background: var(--cmw-bg);
        border: 1px solid var(--cmw-border);
        border-radius: 8px;
        padding: clamp(12px, 3vw, 20px);
        margin: 24px 0;
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        overflow-x: hidden;
    }

    html.dark .cmw-root,
    html[data-color-mode="dark"] .cmw-root {
        --cmw-orange: #ff922b;
    }

    .cmw-root *,
    .cmw-root *::before,
    .cmw-root *::after {
        box-sizing: border-box;
    }

    .cmw-root sub {
        font-size: 0.75em;
        line-height: 0;
    }

    .cmw-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 12px 22px;
        margin-bottom: 10px;
    }

    .cmw-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
    }

    .cmw-field > label,
    .cmw-field > legend {
        font-size: 0.82em;
        font-weight: 600;
        color: var(--cmw-muted);
        padding: 0;
        margin: 0 0 6px;
    }

    .cmw-field-t {
        flex: 1 1 240px;
        max-width: 360px;
    }

    .cmw-slider-row {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .cmw-slider-row input[type="range"] {
        flex: 1 1 auto;
        min-width: 0;
        accent-color: var(--cmw-primary);
        margin: 0;
    }

    .cmw-out {
        font-family: var(--rx-font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
        font-size: 0.9em;
        min-width: 4.6em;
        text-align: right;
    }

    .cmw-seg-buttons {
        display: inline-flex;
        border: 1px solid var(--cmw-border);
        border-radius: 6px;
        overflow: hidden;
    }

    .cmw-seg-item {
        position: relative;
        display: inline-flex;
        cursor: pointer;
    }

    .cmw-seg-item + .cmw-seg-item {
        border-left: 1px solid var(--cmw-border);
    }

    .cmw-seg-item input {
        position: absolute;
        opacity: 0;
        width: 1px;
        height: 1px;
        margin: 0;
    }

    .cmw-seg-item span {
        padding: 4px 11px;
        font-size: 0.92em;
        color: var(--cmw-muted);
    }

    .cmw-seg-item input:checked + span {
        background: var(--cmw-primary);
        color: #ffffff;
    }

    .cmw-seg-item input:focus-visible + span {
        outline: 2px solid var(--cmw-primary);
        outline-offset: -3px;
    }

    .cmw-check label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.92em;
        cursor: pointer;
        padding-bottom: 4px;
    }

    .cmw-check input {
        accent-color: var(--cmw-primary);
        margin: 0;
    }

    .cmw-status {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 16px;
        margin: 0 0 12px;
        font-size: 0.86em;
        color: var(--cmw-muted);
    }

    .cmw-status b {
        color: var(--cmw-fg);
    }

    .cmw-status code {
        font-size: 0.95em;
        padding: 0 4px;
        border-radius: 4px;
        background: var(--cmw-bg-soft);
        color: var(--cmw-fg);
        word-break: break-all;
    }

    .cmw-title {
        font-weight: 600;
        font-size: 0.95em;
        margin: 6px 0 4px;
    }

    .cmw-title-lines {
        margin-top: 18px;
    }

    .cmw-plot {
        width: 100%;
        min-width: 0;
    }

    .cmw-plot svg {
        display: block;
        max-width: 100%;
        touch-action: pan-y;
    }

    .cmw-root svg text {
        fill: var(--cmw-muted);
        font-size: 11px;
        font-family: inherit;
    }

    .cmw-root svg .cmw-axis-label {
        fill: var(--cmw-fg);
        font-size: 11.5px;
    }

    .cmw-gridline {
        stroke: var(--cmw-grid);
        stroke-width: 1;
    }

    .cmw-frame {
        fill: none;
        stroke: var(--cmw-axis);
        stroke-width: 1;
    }

    .cmw-heat .cmw-gridline {
        stroke: none;
    }

    .cmw-contour path {
        fill: none;
        stroke: var(--cmw-fg);
        stroke-opacity: 0.32;
        stroke-width: 0.9;
    }

    .cmw-veil {
        fill: var(--cmw-veil);
        fill-opacity: 0.62;
    }

    .cmw-domain,
    .cmw-domain-v {
        fill: none;
        stroke: var(--cmw-orange);
        stroke-width: 1.6;
        stroke-dasharray: 5 3;
    }

    .cmw-peak path {
        fill: var(--cmw-fg);
        stroke: var(--cmw-bg);
        stroke-width: 1.5;
    }

    .cmw-root svg .cmw-halo {
        fill: var(--cmw-fg);
        font-size: 11.5px;
        font-weight: 600;
        paint-order: stroke;
        stroke: var(--cmw-bg);
        stroke-width: 3.5px;
        stroke-linejoin: round;
    }

    /* Two rings so a point reads on both ends of the colour scale. */
    .cmw-measured .cmw-ring {
        fill: none;
        stroke: var(--cmw-bg);
        stroke-width: 2.6;
    }

    .cmw-measured .cmw-pt {
        stroke: var(--cmw-fg);
        stroke-width: 1.4;
    }

    .cmw-line {
        fill: none;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .cmw-line-out {
        stroke-width: 1.5;
        stroke-dasharray: 3 3;
        stroke-opacity: 0.75;
    }

    .cmw-ref {
        stroke: var(--cmw-fg);
        stroke-opacity: 0.6;
        stroke-width: 1.2;
        stroke-dasharray: 1.5 3;
    }

    .cmw-cross-line {
        stroke: var(--cmw-fg);
        stroke-opacity: 0.45;
        stroke-width: 1;
    }

    .cmw-cross-dot {
        stroke: var(--cmw-bg);
        stroke-width: 1.2;
    }

    .cmw-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px 18px;
    }

    @media (max-width: 600px) {
        .cmw-grid {
            grid-template-columns: minmax(0, 1fr);
        }
    }

    .cmw-panel {
        min-width: 0;
    }

    .cmw-panel-title {
        font-size: 0.88em;
        font-weight: 600;
        margin: 4px 0 0;
    }

    .cmw-panel-note {
        font-size: 0.78em;
        color: var(--cmw-muted);
    }

    .cmw-legend {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 16px;
        margin: 6px 0 4px;
        font-size: 0.8em;
        color: var(--cmw-muted);
    }

    .cmw-leg-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
    }

    .cmw-leg-item svg {
        flex: none;
        overflow: visible;
    }

    .cmw-leg-label {
        font-weight: 600;
        color: var(--cmw-fg);
    }

    .cmw-leg-note {
        flex-basis: 100%;
    }

    .cmw-cb-rect {
        stroke: var(--cmw-axis);
        stroke-width: 0.5;
    }

    .cmw-cb-tick {
        stroke: var(--cmw-fg);
        stroke-opacity: 0.6;
        stroke-width: 1;
    }

    .cmw-root svg .cmw-colourbar text,
    .cmw-colourbar svg text {
        font-size: 10.5px;
    }

    .cmw-sw-contour {
        stroke: var(--cmw-fg);
        stroke-opacity: 0.45;
        stroke-width: 1;
    }

    .cmw-sw-domain {
        stroke: var(--cmw-orange);
        stroke-width: 1.6;
        stroke-dasharray: 5 3;
    }

    .cmw-sw-extrap {
        stroke: var(--cmw-muted);
        stroke-width: 1.5;
        stroke-dasharray: 3 3;
    }

    .cmw-sw-peak {
        fill: var(--cmw-fg);
    }

    .cmw-sw-point {
        fill: #60a5fa;
        stroke: var(--cmw-fg);
        stroke-width: 1.6;
    }

    .cmw-tip {
        position: absolute;
        z-index: 5;
        display: none;
        pointer-events: none;
        max-width: min(300px, calc(100% - 8px));
        padding: 6px 9px;
        border: 1px solid var(--cmw-border);
        border-radius: 6px;
        background: var(--cmw-bg);
        color: var(--cmw-fg);
        font-size: 12px;
        line-height: 1.5;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
        font-variant-numeric: tabular-nums;
    }

    .cmw-tip-note {
        margin-top: 3px;
        color: var(--cmw-muted);
        font-size: 0.92em;
    }

    .cmw-tip-out {
        margin-top: 3px;
        color: var(--cmw-orange);
        font-weight: 600;
    }

    .cmw-tip-sw {
        display: inline-block;
        width: 10px;
        height: 3px;
        margin-right: 5px;
        vertical-align: middle;
        border-radius: 2px;
    }

    .cmw-details {
        margin-top: 14px;
        font-size: 0.86em;
    }

    .cmw-details summary {
        cursor: pointer;
        color: var(--cmw-muted);
    }

    .cmw-table-wrap {
        overflow-x: auto;
        max-width: 100%;
    }

    .cmw-table {
        border-collapse: collapse;
        margin-top: 8px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }

    .cmw-table caption {
        caption-side: top;
        text-align: left;
        color: var(--cmw-muted);
        white-space: normal;
        padding-bottom: 4px;
    }

    .cmw-table th,
    .cmw-table td {
        padding: 3px 9px;
        border-bottom: 1px solid var(--cmw-border);
        text-align: right;
    }

    .cmw-loading,
    .cmw-error {
        color: var(--cmw-muted);
        font-size: 0.9em;
        margin: 0;
    }

    .cmw-error {
        color: var(--cmw-orange);
    }

    @media (max-width: 480px) {
        .cmw-root {
            font-size: 13px;
        }

        .cmw-seg-item span {
            padding: 4px 8px;
        }
    }
</style>

<div class="cmw-root" id="cmwRoot" role="region" aria-label="Compressor efficiency map explorer">
    <p class="cmw-loading">Loading the compressor maps…</p>
</div>

<script type="module">
    (async () => {
        const root = document.getElementById("cmwRoot");
        if (!root || root.dataset.cmwInit) return;   // guard against double injection
        root.dataset.cmwInit = "1";

        // Resolve the `_static/` prefix from an asset the page already loads
        // (robust to GitHub Pages sub-directories), as cycle_widget.html does.
        function staticBase() {
            const node = document.querySelector('link[href*="_static/"], script[src*="_static/"]');
            const attr = node ? (node.getAttribute("href") || node.getAttribute("src")) : null;
            if (attr) {
                const idx = attr.indexOf("_static/");
                if (idx !== -1) return new URL(attr.slice(0, idx) + "_static/", document.baseURI).href;
            }
            return new URL("../_static/", document.baseURI).href;
        }

        const base = staticBase();
        try {
            const [widget, response] = await Promise.all([
                import(base + "js/widgets/compressor-map.js"),
                fetch(base + "data/compressor-maps.json"),
            ]);
            if (!response.ok) throw new Error("HTTP " + response.status);
            const data = await response.json();
            if (data.schema !== 1) throw new Error("unexpected schema " + data.schema);
            widget.mount(root, data);
        } catch (err) {
            root.innerHTML = "";
            const p = document.createElement("p");
            p.className = "cmw-error";
            p.textContent = "Failed to load the compressor maps: " + (err && err.message ? err.message : err)
                + ". Build the docs data with `make -C docs data`, then rebuild the docs.";
            root.appendChild(p);
        }
    })();
</script>
