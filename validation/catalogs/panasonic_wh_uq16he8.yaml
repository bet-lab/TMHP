# WH-UQ16HE8 -- Panasonic Aquarea, R410A, 16 kW nominal heating.
#
# Published heating-performance grid: leaving water temperature x outdoor air
# temperature, with COP printed directly. Transcribed from the manufacturer
# documentation named under `source` below.
#
# The compressor displacement is a published specification of this machine:
# Panasonic's compressor division catalogues 5JD650XBA22 at 65.0 cm3/rev, and
# the outdoor unit's service-manual parts list names that compressor. Rated
# air flow is likewise read verbatim from the service manual. Both are inputs,
# not tuning -- every efficiency coefficient and conductance comes from the
# library defaults.
