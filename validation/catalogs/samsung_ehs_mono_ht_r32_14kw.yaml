sink_offset_K: 2.5
notes: >-
  The paper applies a 2.5 K leaving-water-to-tank offset below 60 degC and
  5 K above it. The harness carries a single offset, so the three 65 degC rows
  are evaluated at 2.5 K, which makes them slightly harder rather than easier.
