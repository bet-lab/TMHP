# Samsung EHS Mono HT Quiet R32 14 kW -- the unit the published validation
# paper uses, kept here so the documented parity numbers come from the same
# harness as every other unit.
#
# Two features of this machine matter when reading its errors. It is a
# high-temperature unit that reaches 65 degC leaving water at -10 degC outdoor
# air, which is a pressure ratio around 16 -- well past a single-stage
# envelope, reached by vapour injection, which TMHP does not model. And no
# compressor displacement is published for it, so this unit exercises the
# derived displacement rule rather than a specification input. Both are
# reasons to expect larger errors here than on the Panasonic units, and the
# results are reported without adjusting for either.
